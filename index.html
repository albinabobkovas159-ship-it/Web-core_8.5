<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web-core_8.5</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1 class="heading">Ремонт техники различных брендов</h1>
    <nav class="brands swiper">
      <div class="brands__swiper swiper-wrapper">
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 (1).svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy (1).svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy 2.svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy 3.svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy 7.svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy 8.svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy 9.svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy 10.svg" />
        </button>
        <button class="brands__button">
          <img src="./Image/cat1 (1).svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy (1).svg" />
        </button>
        <button class="brands__button swiper-slide">
          <img src="./Image/cat1 copy 11.svg" />
        </button>
      </div>
      <button class="brands__show-all">
        <img
          class="brands__arrow"
          src="./Image/expand.svg"
          alt="show all arrow"
        />
        <span class="brands__text">Показать всё</span>
      </button>
      <div class="swiper-pagination"></div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
